[project]
name = "backend"
version = "0.1.0"
description = "2주차 FastAPI 실습용 인사 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit==4.5.1",
    "pytest>=9.1.1",
]
